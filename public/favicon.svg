<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Core Glow Filters -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Metallic Gradients -->
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0d22" />
      <stop offset="50%" stop-color="#070610" />
      <stop offset="100%" stop-color="#020105" />
    </linearGradient>

    <!-- Glowing Accents Gradients -->
    <linearGradient id="ring-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="ring-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#9e7df0" />
      <stop offset="100%" stop-color="#8257e5" />
    </linearGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9e7df0" stop-opacity="1" />
      <stop offset="30%" stop-color="#8257e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8257e5" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Futuristic Outer Shield/Hexagon Frame -->
  <path d="M 50 4 L 92 25 L 92 75 L 50 96 L 8 75 L 8 25 Z" 
        fill="url(#shield-bg)" 
        stroke="#221c40" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Outer Neon Highlight Ring -->
  <path d="M 50 6 L 90 26 L 90 74 L 50 94 L 10 74 L 10 26 Z" 
        fill="none" 
        stroke="url(#ring-violet)" 
        stroke-width="1.5" 
        stroke-opacity="0.4"
        stroke-dasharray="120 40 80 20" />

  <!-- Abstract MERN Stack Orbital Node Design -->
  <g filter="url(#neon-glow)">
    <!-- Cyan Orbit Ellipse -->
    <ellipse cx="50" cy="50" rx="36" ry="12" 
             fill="none" 
             stroke="url(#ring-cyan)" 
             stroke-width="3.5" 
             transform="rotate(30 50 50)" 
             stroke-dasharray="180 30" />

    <!-- Magenta/Violet Orbit Ellipse -->
    <ellipse cx="50" cy="50" rx="36" ry="12" 
             fill="none" 
             stroke="url(#ring-violet)" 
             stroke-width="3.5" 
             transform="rotate(-30 50 50)" 
             stroke-dasharray="160 40" />

    <!-- Intersecting tech lines inside the orbits -->
    <line x1="50" y1="20" x2="50" y2="80" stroke="#b48eed" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4 6" />
    <line x1="20" y1="50" x2="80" y2="50" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4 6" />

    <!-- Core Nucleus (Glowing sphere in the middle) -->
    <circle cx="50" cy="50" r="14" fill="url(#core-glow)" />
    <circle cx="50" cy="50" r="8" fill="#ffffff" />
    
    <!-- Outer accent particles (data packets orbiting) -->
    <circle cx="24" cy="35" r="2.5" fill="#22d3ee" />
    <circle cx="76" cy="65" r="2.5" fill="#d946ef" />
    <circle cx="68" cy="28" r="2" fill="#ffffff" />
  </g>
</svg>
