<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient for Filled Squircle -->
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e7df0" />
      <stop offset="100%" stop-color="#582bca" />
    </linearGradient>
    
    <!-- Text Drop Shadow for premium depth -->
    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Solid Filled Squircle ( VIBRANT VIOLET GRADIENT ) -->
  <rect x="2" y="2" width="96" height="96" rx="28" fill="url(#fav-grad)" />

  <!-- Clean Inner Highlight Border -->
  <rect x="5" y="5" width="90" height="90" rx="25" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />

  <!-- Bold, Readable Name Alphabets "TQ" -->
  <text x="50" y="66" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="46" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="-1.5"
        filter="url(#text-shadow)">TQ</text>
</svg>
